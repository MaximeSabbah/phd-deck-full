<section style="--part-accent: var(--c-secondary-dark-blue);">
    <h2 style="margin:0; color:white;">The pillars of HRC</h2>

    <div style="max-width:1100px; margin:.5rem auto 0;">
      <svg viewBox="0 0 1100 560" width="100%" height="auto" style="display:block;">
        <defs>
          <!-- Bubble styling -->
          <radialGradient id="bubbleFill" cx="50%" cy="40%" r="70%">
            <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#e9eff5" stop-opacity="0.85"/>
          </radialGradient>
          <filter id="bubbleShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0d2a4a" flood-opacity="0.18"/>
          </filter>

          <!-- Arrowhead sized in user units (no ballooning) -->
          <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6"
                  orient="auto" markerUnits="userSpaceOnUse">
            <polygon points="0,0 12,6 0,12" fill="#0d2a4a"/>
          </marker>

          <style>
            .bubble { fill:url(#bubbleFill); stroke:#0d2a4a; stroke-width:3; filter:url(#bubbleShadow); }
            .centerT { fill:#0d2a4a; font-weight:700; font-size:20px; }
            .centerS { fill:#7e96ab; font-size:16px; }
            .main    { fill:#0d2a4a; font-weight:700; font-size:18px; }
            .sub     { fill:#7e96ab; font-size:15px; }
            .conn    { stroke:#0d2a4a; stroke-opacity:.9; stroke-width:4; fill:none; stroke-linecap:round; marker-end:url(#arrowHead); }
          </style>
        </defs>

        <!-- Top center -->
        <g>
          <circle cx="550" cy="150" r="90" class="bubble"/>
          <image href="./assets/icons/handshake.svg" x="530" y="110" width="40" height="40" />
          <image href="./assets/icons/face.svg" x="480" y="100" width="50" height="50" />
          <image href="./assets/icons/robot_2.svg" x="565" y="100" width="50" height="50" />

          <text x="550" y="180" text-anchor="middle" class="centerT">HRC</text>
        </g>

        <!-- HRC bottom point = (550, 240) -->

        <!-- Far-left (kept exactly): cx=131, cy=340, r=130 -->
        <g class="fragment">
          <!-- Arrow lands on the circle perimeter (~257,310) with a smooth curve -->
          <path d="M550,240 Q404,297 257,310" class="conn"/>
          <circle cx="131" cy="340" r="130" class="bubble"/>
          <image href="./assets/icons/emoji_people.svg" x="95" y="250" width="70" height="70" />
          <text x="131" y="350" text-anchor="middle" class="main">Biomechanical modeling</text>
          <text x="131" y="380" text-anchor="middle" class="sub">
            <tspan x="131" dy="0">Targets individual</tspan>
            <tspan x="131" dy="18">specificities</tspan>
          </text>
        </g>

        <!-- Even spacing for the remaining three: x = 409, 687, 965 -->
        <!-- Left-mid: cx=409, cy=430, r=120 -->
        <g class="fragment">
          <!-- Arrow lands at (~480,334) -->
          <path d="M550,240 Q515,305 480,334" class="conn"/>
          <circle cx="409" cy="430" r="120" class="bubble"/>
          <image href="./assets/icons/visibility.svg" x="370" y="350" width="70" height="70" />
          <text x="409" y="438" text-anchor="middle" class="main">Real-time state estimation</text>
          <text x="409" y="462" text-anchor="middle" class="sub">
            <tspan x="409" dy="0">Robust and accurate </tspan>
            <tspan x="409" dy="18">full-body motion estimation</tspan>
          </text>
        </g>

        <!-- Right-mid: cx=687, cy=430, r=120 -->
        <g class="fragment">
          <!-- Arrow lands at (~617,333) -->
          <path d="M550,240 Q583,304 617,333" class="conn"/>
          <circle cx="687" cy="430" r="120" class="bubble"/>
          <image href="./assets/icons/update.svg" x="653" y="350" width="70" height="70" />
          <text x="687" y="438" text-anchor="middle" class="main">Intent &amp; motion prediction</text>
          <text x="687" y="462" text-anchor="middle" class="sub">
            <tspan x="687" dy="0">Forecast and explain</tspan>
            <tspan x="687" dy="18">incoming motions</tspan>
          </text>
        </g>

        <!-- Far-right (kept exactly): cx=965, cy=340, r=130 -->
        <g class="fragment">
          <!-- Arrow lands at (~839,310) -->
          <path d="M550,240 Q694,297 839,310" class="conn"/>
          <circle cx="965" cy="340" r="130" class="bubble"/>
          <image href="./assets/icons/precision_manufacturing.svg" x="930" y="250" width="70" height="70" />
          <text x="965" y="350" text-anchor="middle" class="main">Proactive &amp; predictive control</text>
          <text x="965" y="380" text-anchor="middle" class="sub">
            <tspan x="965" dy="0">Act with anticipation</tspan>
            <tspan x="965" dy="18"> and safety </tspan>
          </text>
        </g>

        <!-- Final apparition: simple red highlight of the right-mid bubble -->
        <g class="fragment">
          <circle
            cx="687" cy="430" r="120"
            fill="none"
            stroke="#c53030"
            stroke-width="6"
            style="pointer-events:none;"
          />
        </g>
      </svg>
    </div>
</section>
