<section data-part-group="part-i" data-part-title="PART I"
        class="has-abs-overlay"
         style="--part-accent: var(--c-laas-red);">
        <h2 style="background-color:var(--c-laas-red); margin:0px;">
        Demonstration
        </h2>

        <div class="video-legend-wrap">
            <video data-autoplay muted playsinline data-loops="1" style="display:block; margin-top: 2%; width:100%;">
            <source data-src="./videos/Part-I/comparison_cosmik.mp4" type="video/mp4">
            </video>

            <!-- Overlay legend -->
            <div class="video-legend">
                <div class="legend-item">
                    <span class="legend-dot grey"></span> Reference
                </div>
                <div class="legend-item">
                    <span class="legend-dot green"></span> RT-COSMIK
                </div>
            </div>
        </div>
        <div style="font-size: 0.6em;">
            <ul class="pc-list">
                <li class="pro">Good tracking results in real-time!</b></li>
            </ul>
        </div>

        <!-- Independent overlay you can trigger whenever you want -->
        <div class="chart-overlay fragment fade-in"
            data-fragment-index="1"
            style="
            --chart-left: 50%;
            --chart-bottom: -5%;          /* set top/left/right/bottom as you like */
            --chart-transform: translateX(-50%);
            --chart-width: 30vw;">
        <img src="./assets/part-I/opencap_vs_ours_bar.png"
            alt="Bar chart: OpenCap vs Ours (Lower-limbs, Upper-limbs, degrees)">
        </div>
</section>
